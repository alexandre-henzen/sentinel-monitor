version: '3.8'

services:
  # EAM API Service
  eam-api:
    build:
      context: .
      dockerfile: src/API/EAM.API/Dockerfile
    container_name: eam-api
    ports:
      - "7001:8080"
      - "7002:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=EAM_DB;Username=eam_user;Password=eam_password
      - ConnectionStrings__RedisConnection=redis:6379
      - Jwt__Key=YourSecretKeyHere_ChangeInProduction_32Chars
      - Jwt__Issuer=EAM.API
      - Jwt__Audience=EAM.Clients
      - Telemetry__JaegerEndpoint=http://jaeger:14268/api/traces
      - Telemetry__PrometheusEndpoint=http://prometheus:9090/metrics
    depends_on:
      - postgres
      - redis
      - minio
      - jaeger
    networks:
      - eam-network
    volumes:
      - eam-api-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # EAM Web Service
  eam-web:
    build:
      context: .
      dockerfile: src/Web/EAM.Web/Dockerfile
    container_name: eam-web
    ports:
      - "4200:8080"
      - "4201:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ApiSettings__BaseUrl=http://eam-api:8080
      - Telemetry__JaegerEndpoint=http://jaeger:14268/api/traces
      - Telemetry__PrometheusEndpoint=http://prometheus:9090/metrics
    depends_on:
      - eam-api
      - jaeger
    networks:
      - eam-network
    volumes:
      - eam-web-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # EAM Agent Service (for testing only)
  eam-agent:
    build:
      context: .
      dockerfile: src/Agent/EAM.Agent/Dockerfile
    container_name: eam-agent
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://eam-api:8080
      - AgentSettings__DataSyncInterval=30
      - AgentSettings__ScreenshotInterval=300
      - AgentSettings__EnableWebTracking=true
      - AgentSettings__EnableTeamsTracking=false
      - AgentSettings__EnableScreenshots=false
      - Telemetry__JaegerEndpoint=http://jaeger:14268/api/traces
      - Telemetry__PrometheusEndpoint=http://prometheus:9090/metrics
    depends_on:
      - eam-api
      - jaeger
    networks:
      - eam-network
    volumes:
      - eam-agent-data:/app/Data
      - eam-agent-logs:/app/logs
    profiles:
      - testing

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eam-postgres
    environment:
      - POSTGRES_DB=EAM_DB
      - POSTGRES_USER=eam_user
      - POSTGRES_PASSWORD=eam_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eam_user -d EAM_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: eam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: eam-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=eam_minio
      - MINIO_ROOT_PASSWORD=eam_minio_password
    volumes:
      - minio-data:/data
    networks:
      - eam-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: eam-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - eam-network
    profiles:
      - observability

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: eam-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - eam-network
    profiles:
      - observability

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: eam-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=eam_grafana_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - eam-network
    depends_on:
      - prometheus
    profiles:
      - observability

  # Loki Logs
  loki:
    image: grafana/loki:latest
    container_name: eam-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki.yml:/etc/loki/local-config.yaml
    networks:
      - eam-network
    profiles:
      - observability

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: eam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/ssl:/etc/ssl/certs
    depends_on:
      - eam-api
      - eam-web
    networks:
      - eam-network
    profiles:
      - production

networks:
  eam-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  eam-api-logs:
  eam-web-logs:
  eam-agent-data:
  eam-agent-logs: