name: EAM - Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'

jobs:
  # Job 1: Code Quality and Standards
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Web/EAM.Web/ClientApp/package-lock.json
        
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore .NET dependencies
      run: dotnet restore EAM.sln
      
    - name: Install Angular dependencies
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm ci
        
    - name: Check .NET code formatting
      run: dotnet format EAM.sln --verify-no-changes --verbosity diagnostic
      
    - name: Lint Angular code
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm run lint
        
    - name: Run .NET code analysis
      run: dotnet build EAM.sln --configuration Release --verbosity normal
      
    - name: Check for TODO/FIXME comments
      run: |
        if grep -r "TODO\|FIXME\|HACK" src/ --include="*.cs" --include="*.ts" --include="*.js"; then
          echo "Found TODO/FIXME/HACK comments. Please resolve before merging."
          exit 1
        fi

  # Job 2: Fast Tests
  fast-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Web/EAM.Web/ClientApp/package-lock.json
        
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore EAM.sln
      
    - name: Build solution
      run: dotnet build EAM.sln --configuration Release --no-restore
      
    - name: Run unit tests
      run: dotnet test EAM.sln --configuration Release --no-build --filter "Category!=Integration" --verbosity normal
      
    - name: Install Angular dependencies
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm ci
        
    - name: Run Angular tests
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm run test:ci

  # Job 3: Security Check
  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Run .NET security audit
      run: dotnet list package --vulnerable --include-transitive
      
    - name: Install Angular dependencies
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm ci
        
    - name: Run npm audit
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm audit --audit-level moderate
        
    - name: Check for hardcoded secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  # Job 4: Build Verification
  build-verification:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Web/EAM.Web/ClientApp/package-lock.json
        
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore EAM.sln
      
    - name: Build solution
      run: dotnet build EAM.sln --configuration Release --no-restore
      
    - name: Publish applications
      run: |
        dotnet publish src/API/EAM.API/EAM.API.csproj -c Release -o ./publish/api --no-restore
        dotnet publish src/Web/EAM.Web/EAM.Web.csproj -c Release -o ./publish/web --no-restore
        dotnet publish src/Agent/EAM.Agent/EAM.Agent.csproj -c Release -o ./publish/agent --no-restore
        
    - name: Install Angular dependencies
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm ci
        
    - name: Build Angular app
      run: |
        cd src/Web/EAM.Web/ClientApp
        npm run build:prod
        
    - name: Check build artifacts
      run: |
        ls -la ./publish/
        ls -la ./publish/api/
        ls -la ./publish/web/
        ls -la ./publish/agent/
        ls -la src/Web/EAM.Web/ClientApp/dist/

  # Job 5: PR Comment with Results
  pr-comment:
    runs-on: ubuntu-latest
    needs: [code-quality, fast-tests, security-check, build-verification]
    if: always()
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const results = {
            'Code Quality': '${{ needs.code-quality.result }}',
            'Fast Tests': '${{ needs.fast-tests.result }}',
            'Security Check': '${{ needs.security-check.result }}',
            'Build Verification': '${{ needs.build-verification.result }}'
          };
          
          let message = '## 🔍 PR Validation Results\n\n';
          
          for (const [job, result] of Object.entries(results)) {
            const emoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⚠️';
            message += `- ${emoji} **${job}**: ${result}\n`;
          }
          
          if (Object.values(results).every(r => r === 'success')) {
            message += '\n🎉 All checks passed! This PR is ready for review.';
          } else {
            message += '\n⚠️ Some checks failed. Please review the workflow logs and fix any issues.';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });