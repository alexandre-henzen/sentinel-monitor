global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'eam-api'
    static_configs:
      - targets: ['eam-api:8080']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'eam-agent'
    static_configs:
      - targets: ['eam-agent:8080']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: /metrics
    scrape_interval: 5s